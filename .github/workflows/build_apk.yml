                                    ),
                                    child: Center(
                                      child: photo.preview == null
                                          ? const CircularProgressIndicator()
                                          : ClipRRect(
                                              borderRadius:
                                                  BorderRadius.circular(
                                                20,
                                              ),
                                              child:
                                                  Image.memory(
                                                photo.preview!,
                                                fit: BoxFit.contain,
                                                gaplessPlayback:
                                                    true,
                                              ),
                                            ),
                                    ),
                                  );
                                },
                              ),
                      ),
                      Padding(
                        padding:
                            const EdgeInsets.fromLTRB(
                          16,
                          0,
                          16,
                          16,
                        ),
                        child: Column(
                          children: [
                            if (_working)
                              const LinearProgressIndicator(),
                            const SizedBox(height: 8),
                            Text(
                              _status,
                              textAlign:
                                  TextAlign.center,
                            ),
                            const SizedBox(height: 8),
                            SizedBox(
                              width: double.infinity,
                              child: FilledButton.icon(
                                onPressed: _working ||
                                        _photos.isEmpty
                                    ? null
                                    : _saveAll,
                                icon: const Icon(
                                  Icons.download,
                                ),
                                label: const Text(
                                  'Save All HD to Gallery',
                                ),
                              ),
                            ),
                          ],
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          EOF

      - name: Configure Android SDK and release lint
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path('android/app/build.gradle.kts'),
              Path('android/app/build.gradle'),
          ]

          build_file = next(
              (path for path in candidates if path.exists()),
              None,
          )

          if build_file is None:
              raise SystemExit(
                  'Flutter Android Gradle build file was not generated'
              )

          text = build_file.read_text()

          if build_file.suffix == '.kts':
              replacements = [
                  (
                      r'compileSdk\s*=\s*flutter\.compileSdkVersion',
                      'compileSdk = 36',
                  ),
                  (
                      r'targetSdk\s*=\s*flutter\.targetSdkVersion',
                      'targetSdk = 36',
                  ),
                  (
                      r'minSdk\s*=\s*flutter\.minSdkVersion',
                      'minSdk = 24',
                  ),
              ]

              lint = (
                  '    lint {\n'
                  '        checkReleaseBuilds = false\n'
                  '        abortOnError = false\n'
                  '    }\n'
              )
          else:
              replacements = [
                  (
                      r'compileSdk\s+flutter\.compileSdkVersion',
                      'compileSdk 36',
                  ),
                  (
                      r'targetSdk\s+flutter\.targetSdkVersion',
                      'targetSdk 36',
                  ),
                  (
                      r'minSdk\s+flutter\.minSdkVersion',
                      'minSdk 24',
                  ),
              ]

              lint = (
                  '    lint {\n'
                  '        checkReleaseBuilds false\n'
                  '        abortOnError false\n'
                  '    }\n'
              )

          for pattern, replacement in replacements:
              text, count = re.subn(pattern, replacement, text)
              if count == 0:
                  raise SystemExit(
                      f'Expected Gradle setting not found: {pattern}'
                  )

          if re.search(r'(?m)^\s*lint\s*\{', text) is None:
              start = re.search(r'(?m)^android\s*\{', text)
              if start is None:
                  raise SystemExit(
                      'Could not find android { } block '
                      'to configure lint'
                  )

              depth = 0
              quote = None
              escaped = False
              end = None

              for i in range(start.end() - 1, len(text)):
                  ch = text[i]

                  if quote:
                      if escaped:
                          escaped = False
                      elif ch == '\\':
                          escaped = True
                      elif ch == quote:
                          quote = None
                      continue

                  if ch in ('"', "'"):
                      quote = ch
                  elif ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          end = i
                          break

              if end is None:
                  raise SystemExit(
                      'Could not find end of android { } block'
                  )

              text = text[:end] + lint + text[end:]

          build_file.write_text(text)
          print(
              f'Configured {build_file} for SDK 36 / '
              'min SDK 24 and release lint'
          )
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app-release.apk
          if-no-files-found: error
          retention-days: 30
