name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
        

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter project
        run: flutter create --platforms android --org com.example .

      - name: Remove generated sample test
        run: rm -f test/widget_test.dart

      - name: Write pubspec.yaml
        run: |
          cat << 'EOF' > pubspec.yaml
          name: my_photoroom
          description: Photoroom-like Phase 1 Flutter Android app
          publish_to: "none"
          version: 1.0.0+1

          environment:
            sdk: ">=3.3.0 <4.0.0"

          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.8
            image_picker: ^1.1.2
            google_mlkit_subject_segmentation: ^0.0.2
            gal: ^2.3.0
            image: ^4.3.0
            path_provider: ^2.1.4

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^4.0.0

          flutter:
            uses-material-design: true
          EOF

      - name: Write Android manifest
        run: |
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission
                  android:name="android.permission.READ_EXTERNAL_STORAGE"
                  android:maxSdkVersion="32" />

              <application
                  android:name="${applicationName}"
                  android:label="My PhotoRoom"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:taskAffinity=""
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

      - name: Write lib/main.dart
        run: |
          mkdir -p lib
          cat << 'EOF' > lib/main.dart
          import 'dart:io';
          import 'dart:typed_data';
          import 'dart:ui' as ui;

          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:gal/gal.dart';
          import 'package:google_mlkit_subject_segmentation/google_mlkit_subject_segmentation.dart';
          import 'package:image/image.dart' as img;
          import 'package:image_picker/image_picker.dart';
          import 'package:path_provider/path_provider.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            SystemChrome.setSystemUIOverlayStyle(
              const SystemUiOverlayStyle(
                statusBarColor: Colors.transparent,
                statusBarIconBrightness: Brightness.light,
              ),
            );
            runApp(const PhotoRoomApp());
          }

          class PhotoRoomApp extends StatelessWidget {
            const PhotoRoomApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'My PhotoRoom',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  useMaterial3: true,
                  brightness: Brightness.dark,
                  scaffoldBackgroundColor: const Color(0xFF111218),
                  colorScheme: const ColorScheme.dark(
                    primary: Color(0xFF7557FF),
                    secondary: Color(0xFF3B82F6),
                    surface: Color(0xFF1A1C24),
                  ),
                ),
                home: const HomeScreen(),
              );
            }
          }

          class HomeScreen extends StatefulWidget {
            const HomeScreen({super.key});

            @override
            State<HomeScreen> createState() => _HomeScreenState();
          }

          class _HomeScreenState extends State<HomeScreen> {
            bool processing = false;

            Future<void> pickAndProcess() async {
              final file = await ImagePicker().pickImage(
                source: ImageSource.gallery,
                imageQuality: 100,
              );
              if (file == null || !mounted) return;

              setState(() => processing = true);

              final segmenter = SubjectSegmenter(
                options: SubjectSegmenterOptions(
                  enableMultipleSubjects: false,
                ),
              );

              try {
                final SubjectSegmentationResult? result =
                    await segmenter.processImage(
                  InputImage.fromFilePath(file.path),
                );

                if (result == null) {
                  throw Exception('Subject segmentation returned no result');
                }

                final cutout = await createCutout(file.path, result);

                if (!mounted) return;
                await Navigator.of(context).push(
                  MaterialPageRoute<void>(
                    builder: (_) => EditorScreen(cutoutBytes: cutout),
                  ),
                );
              } catch (error) {
                if (!mounted) return;
                ScaffoldMessenger.of(context).showSnackBar(
                  SnackBar(
                    content: Text('Background removal failed: $error'),
                  ),
                );
              } finally {
                await segmenter.close();
                if (mounted) setState(() => processing = false);
              }
            }

            Future<Uint8List> createCutout(
              String sourcePath,
              SubjectSegmentationResult result,
            ) async {
              final sourceBytes = await File(sourcePath).readAsBytes();
              final decoded = img.decodeImage(sourceBytes);
              if (decoded == null) {
                throw Exception('Unable to decode the selected image');
              }

              final mask = result.foregroundConfidenceMask;
              if (mask != null) {
                final output = img.Image(
                  width: decoded.width,
                  height: decoded.height,
                  numChannels: 4,
                );

                for (int y = 0; y < decoded.height; y++) {
                  for (int x = 0; x < decoded.width; x++) {
                    final confidence = mask.get(x, y).clamp(0.0, 1.0);
                    final pixel = decoded.getPixel(x, y);
                    output.setPixelRgba(
                      x,
                      y,
                      pixel.r.toInt(),
                      pixel.g.toInt(),
                      pixel.b.toInt(),
                      (confidence * 255).round(),
                    );
                  }
                }

                return Uint8List.fromList(img.encodePng(output));
              }

              final bitmap = await result.getForegroundBitmap();
              if (bitmap == null) {
                throw Exception('No foreground bitmap was produced');
              }
              return Uint8List.fromList(bitmap);
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(
                  child: Stack(
                    children: [
                      SingleChildScrollView(
                        padding: const EdgeInsets.fromLTRB(20, 18, 20, 32),
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            Row(
                              children: [
                                Container(
                                  width: 42,
                                  height: 42,
                                  decoration: BoxDecoration(
                                    gradient: const LinearGradient(
                                      colors: [
                                        Color(0xFF9B5CF6),
                                        Color(0xFF5B79FF),
                                      ],
                                    ),
                                    borderRadius: BorderRadius.circular(12),
                                  ),
                                  child: const Icon(
                                    Icons.auto_awesome,
                                    color: Colors.white,
                                  ),
                                ),
                                const SizedBox(width: 12),
                                const Text(
                                  'My PhotoRoom',
                                  style: TextStyle(
                                    fontSize: 22,
                                    fontWeight: FontWeight.w800,
                                  ),
                                ),
                              ],
                            ),
                            const SizedBox(height: 28),
                            const Text(
                              'Create in seconds',
                              style: TextStyle(
                                fontSize: 30,
                                fontWeight: FontWeight.w900,
                              ),
                            ),
                            const SizedBox(height: 8),
                            Text(
                              'Remove backgrounds and create clean product photos.',
                              style: TextStyle(
                                color: Colors.white.withValues(alpha: 0.62),
                              ),
                            ),
                            const SizedBox(height: 24),
                            SizedBox(
                              height: 72,
                              width: double.infinity,
                              child: FilledButton.icon(
                                onPressed: processing ? null : pickAndProcess,
                                icon: const Icon(
                                  Icons.add_photo_alternate_rounded,
                                  size: 26,
                                ),
                                label: const Text(
                                  'Start from Photo',
                                  style: TextStyle(
                                    fontSize: 18,
                                    fontWeight: FontWeight.w800,
                                  ),
                                ),
                                style: FilledButton.styleFrom(
                                  backgroundColor: const Color(0xFF7557FF),
                                  shape: RoundedRectangleBorder(
                                    borderRadius: BorderRadius.circular(18),
                                  ),
                                ),
                              ),
                            ),
                            const SizedBox(height: 28),
                            const Text(
                              'Quick start',
                              style: TextStyle(
                                fontSize: 17,
                                fontWeight: FontWeight.w800,
                              ),
                            ),
                            const SizedBox(height: 14),
                            GridView.count(
                              shrinkWrap: true,
                              physics: const NeverScrollableScrollPhysics(),
                              crossAxisCount: 2,
                              mainAxisSpacing: 12,
                              crossAxisSpacing: 12,
                              childAspectRatio: 1.35,
                              children: const [
                                QuickCard(
                                  title: 'Transparent',
                                  icon: Icons.grid_on,
                                  preview: Colors.transparent,
                                ),
                                QuickCard(
                                  title: 'White BG',
                                  icon: Icons.circle,
                                  preview: Colors.white,
                                ),
                                QuickCard(
                                  title: 'Black BG',
                                  icon: Icons.dark_mode,
                                  preview: Color(0xFF171717),
                                ),
                                QuickCard(
                                  title: 'Square 1:1',
                                  icon: Icons.crop_square,
                                  preview: Color(0xFF32374A),
                                ),
                              ],
                            ),
                          ],
                        ),
                      ),
                      if (processing)
                        Container(
                          color: const Color(0xCC111218),
                          child: const Center(
                            child: Column(
                              mainAxisSize: MainAxisSize.min,
                              children: [
                                ScanningGlow(),
                                SizedBox(height: 18),
                                Text(
                                  'Removing background...',
                                  style: TextStyle(
                                    fontSize: 17,
                                    fontWeight: FontWeight.w800,
                                  ),
                                ),
                              ],
                            ),
                          ),
                        ),
                    ],
                  ),
                ),
              );
            }
          }

          class QuickCard extends StatelessWidget {
            final String title;
            final IconData icon;
            final Color preview;

            const QuickCard({
              super.key,
              required this.title,
              required this.icon,
              required this.preview,
            });

            @override
            Widget build(BuildContext context) {
              return InkWell(
                onTap: () {
                  ScaffoldMessenger.of(context).showSnackBar(
                    SnackBar(content: Text('$title selected')),
                  );
                },
                borderRadius: BorderRadius.circular(16),
                child: Ink(
                  decoration: BoxDecoration(
                    color: const Color(0xFF1C1E27),
                    borderRadius: BorderRadius.circular(16),
                    border: Border.all(color: Colors.white10),
                  ),
                  child: Stack(
                    children: [
                      Positioned(
                        right: 12,
                        top: 12,
                        child: Container(
                          width: 54,
                          height: 54,
                          decoration: BoxDecoration(
                            color: preview == Colors.transparent
                                ? Colors.black26
                                : preview,
                            borderRadius: BorderRadius.circular(10),
                            border: Border.all(color: Colors.white24),
                          ),
                        ),
                      ),
                      Positioned(
                        left: 14,
                        bottom: 14,
                        child: Row(
                          children: [
                            Icon(icon, size: 18, color: Colors.white70),
                            const SizedBox(width: 7),
                            Text(
                              title,
                              style: const TextStyle(
                                fontWeight: FontWeight.w700,
                              ),
                            ),
                          ],
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class ScanningGlow extends StatefulWidget {
            const ScanningGlow({super.key});

            @override
            State<ScanningGlow> createState() => _ScanningGlowState();
          }

          class _ScanningGlowState extends State<ScanningGlow>
              with SingleTickerProviderStateMixin {
            late final AnimationController controller;

            @override
            void initState() {
              super.initState();
              controller = AnimationController(
                vsync: this,
                duration: const Duration(milliseconds: 1400),
              )..repeat(reverse: true);
            }

            @override
            void dispose() {
              controller.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return AnimatedBuilder(
                animation: controller,
                builder: (_, __) => Container(
                  width: 94,
                  height: 94,
                  decoration: BoxDecoration(
                    shape: BoxShape.circle,
                    border: Border.all(
                      color: const Color(0xFF7F72FF),
                      width: 3,
                    ),
                    boxShadow: [
                      BoxShadow(
                        color: const Color(0xFF715EFF).withValues(
                          alpha: 0.25 + controller.value * 0.55,
                        ),
                        blurRadius: 18 + controller.value * 18,
                        spreadRadius: 4,
                      ),
                    ],
                  ),
                  child: const Icon(Icons.person_search, size: 42),
                ),
              );
            }
          }

          class EditorSettings {
            final Offset position;
            final double scale;
            final double angle;

            const EditorSettings({
              this.position = Offset.zero,
              this.scale = 1,
              this.angle = 0,
            });

            EditorSettings copyWith({
              Offset? position,
              double? scale,
              double? angle,
            }) {
              return EditorSettings(
                position: position ?? this.position,
                scale: scale ?? this.scale,
                angle: angle ?? this.angle,
              );
            }
          }

          class EditorScreen extends StatefulWidget {
            final Uint8List cutoutBytes;

            const EditorScreen({
              super.key,
              required this.cutoutBytes,
            });

            @override
            State<EditorScreen> createState() => _EditorScreenState();
          }

          class _EditorScreenState extends State<EditorScreen> {
            late final Future<ui.Image> cutoutImage;
            final List<EditorSettings> history = [const EditorSettings()];
            int historyIndex = 0;

            Offset gestureStartPosition = Offset.zero;
            double gestureStartScale = 1;
            double gestureStartAngle = 0;
            bool showGuides = false;

            EditorSettings get settings => history[historyIndex];

            @override
            void initState() {
              super.initState();
              cutoutImage = decodeImageFromList(widget.cutoutBytes);
            }

            void saveGestureState() {
              if (historyIndex < history.length - 1) {
                history.removeRange(historyIndex + 1, history.length);
              }
              history.add(settings);
              historyIndex = history.length - 1;
            }

            void undo() {
              if (historyIndex > 0) setState(() => historyIndex--);
            }

            void redo() {
              if (historyIndex < history.length - 1) {
                setState(() => historyIndex++);
              }
            }

            Future<void> exportPng() async {
              try {
                final bytes = await renderPng();
                final directory = await getTemporaryDirectory();
                final file = File(
                  '${directory.path}/my_photoroom_'
                  '${DateTime.now().millisecondsSinceEpoch}.png',
                );
                await file.writeAsBytes(bytes);
                await Gal.putImage(file.path, album: 'My PhotoRoom');

                if (!mounted) return;
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(content: Text('Saved to gallery')),
                );
              } catch (error) {
                if (!mounted) return;
                ScaffoldMessenger.of(context).showSnackBar(
                  SnackBar(content: Text('Export failed: $error')),
                );
              }
            }

            Future<Uint8List> renderPng() async {
              const int outputSize = 2048;
              final image = await cutoutImage;
              final recorder = ui.PictureRecorder();
              final canvas = Canvas(recorder);

              final double ratio = image.width > image.height
                  ? image.height / image.width
                  : image.width / image.height;
              final double baseWidth = image.width > image.height
                  ? outputSize.toDouble()
                  : outputSize * ratio;
              final double baseHeight = image.height >= image.width
                  ? outputSize.toDouble()
                  : outputSize * ratio;

              final double drawWidth = baseWidth * settings.scale;
              final double drawHeight = baseHeight * settings.scale;
              final double dx =
                  outputSize / 2 - drawWidth / 2 + settings.position.dx * 2;
              final double dy =
                  outputSize / 2 - drawHeight / 2 + settings.position.dy * 2;

              canvas.save();
              canvas.translate(dx + drawWidth / 2, dy + drawHeight / 2);
              canvas.rotate(settings.angle);
              canvas.translate(-drawWidth / 2, -drawHeight / 2);
              canvas.drawImageRect(
                image,
                Rect.fromLTWH(
                  0,
                  0,
                  image.width.toDouble(),
                  image.height.toDouble(),
                ),
                Rect.fromLTWH(0, 0, drawWidth, drawHeight),
                Paint(),
              );
              canvas.restore();

              final rendered = await recorder.endRecording().toImage(
                    outputSize,
                    outputSize,
                  );
              final data = await rendered.toByteData(
                format: ui.ImageByteFormat.png,
              );
              if (data == null) throw Exception('Unable to encode PNG');
              return data.buffer.asUint8List();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text(
                    'Edit Photo',
                    style: TextStyle(fontWeight: FontWeight.w800),
                  ),
                  actions: [
                    IconButton(
                      onPressed: historyIndex > 0 ? undo : null,
                      icon: const Icon(Icons.undo),
                    ),
                    IconButton(
                      onPressed:
                          historyIndex < history.length - 1 ? redo : null,
                      icon: const Icon(Icons.redo),
                    ),
                    Padding(
                      padding: const EdgeInsets.only(right: 12),
                      child: FilledButton.icon(
                        onPressed: exportPng,
                        icon: const Icon(Icons.download),
                        label: const Text('Export'),
                      ),
                    ),
                  ],
                ),
                body: Column(
                  children: [
                    Expanded(
                      child: LayoutBuilder(
                        builder: (context, constraints) {
                          final canvasSize = Size(
                            constraints.maxWidth,
                            constraints.maxHeight,
                          );

                          return GestureDetector(
                            onScaleStart: (_) {
                              gestureStartPosition = settings.position;
                              gestureStartScale = settings.scale;
                              gestureStartAngle = settings.angle;
                              setState(() => showGuides = true);
                            },
                            onScaleUpdate: (details) {
                              Offset position =
                                  gestureStartPosition + details.focalPointDelta;

                              if (position.dx.abs() < 18) {
                                position = Offset(0, position.dy);
                              }
                              if (position.dy.abs() < 18) {
                                position = Offset(position.dx, 0);
                              }

                              setState(() {
                                showGuides =
                                    position.dx == 0 || position.dy == 0;
                                history[historyIndex] = settings.copyWith(
                                  position: position,
                                  scale: (gestureStartScale * details.scale)
                                      .clamp(0.25, 5.0),
                                  angle:
                                      gestureStartAngle + details.rotation,
                                );
                              });
                            },
                            onScaleEnd: (_) {
                              final current = settings;
                              if (historyIndex < history.length - 1) {
                                history.removeRange(
                                  historyIndex + 1,
                                  history.length,
                                );
                              }
                              history.add(current);
                              historyIndex = history.length - 1;
                              setState(() => showGuides = false);
                            },
                            child: FutureBuilder<ui.Image>(
                              future: cutoutImage,
                              builder: (context, snapshot) {
                                if (!snapshot.hasData) {
                                  return const Center(
                                    child: CircularProgressIndicator(),
                                  );
                                }
                                return CustomPaint(
                                  painter: CanvasPainter(
                                    image: snapshot.data!,
                                    settings: settings,
                                    showGuides: showGuides,
                                  ),
                                  size: canvasSize,
                                );
                              },
                            ),
                          );
                        },
                      ),
                    ),
                    Container(
                      height: 82,
                      color: const Color(0xFF171820),
                      child: const Row(
                        mainAxisAlignment: MainAxisAlignment.spaceEvenly,
                        children: [
                          BottomTool(icon: Icons.crop_square, label: 'Canvas'),
                          BottomTool(
                            icon: Icons.format_paint,
                            label: 'Background',
                          ),
                          BottomTool(icon: Icons.tune, label: 'Adjust'),
                          BottomTool(icon: Icons.text_fields, label: 'Text'),
                        ],
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          Future<ui.Image> decodeImageFromList(Uint8List bytes) {
            return ui.decodeImageFromList(bytes);
          }

          class CanvasPainter extends CustomPainter {
            final ui.Image image;
            final EditorSettings settings;
            final bool showGuides;

            CanvasPainter({
              required this.image,
              required this.settings,
              required this.showGuides,
            });

            @override
            void paint(Canvas canvas, Size size) {
              const double square = 16;

              for (double y = 0; y < size.height; y += square) {
                for (double x = 0; x < size.width; x += square) {
                  final bool dark =
                      ((x / square).floor() + (y / square).floor()).isEven;
                  canvas.drawRect(
                    Rect.fromLTWH(x, y, square, square),
                    Paint()
                      ..color = dark
                          ? const Color(0xFF1F2028)
                          : const Color(0xFF272932),
                  );
                }
              }

              if (showGuides) {
                final guidePaint = Paint()
                  ..color = const Color(0xFF4DA3FF)
                  ..strokeWidth = 1.5;
                canvas.drawLine(
                  Offset(size.width / 2, 0),
                  Offset(size.width / 2, size.height),
                  guidePaint,
                );
                canvas.drawLine(
                  Offset(0, size.height / 2),
                  Offset(size.width, size.height / 2),
                  guidePaint,
                );
              }

              final double imageWidth;
              final double imageHeight;
              if (image.width > image.height) {
                imageWidth = size.width * 0.72 * settings.scale;
                imageHeight = imageWidth * image.height / image.width;
              } else {
                imageHeight = size.height * 0.72 * settings.scale;
                imageWidth = imageHeight * image.width / image.height;
              }

              canvas.save();
              canvas.translate(
                size.width / 2 + settings.position.dx,
                size.height / 2 + settings.position.dy,
              );
              canvas.rotate(settings.angle);
              canvas.drawImageRect(
                image,
                Rect.fromLTWH(
                  0,
                  0,
                  image.width.toDouble(),
                  image.height.toDouble(),
                ),
                Rect.fromLTWH(
                  -imageWidth / 2,
                  -imageHeight / 2,
                  imageWidth,
                  imageHeight,
                ),
                Paint(),
              );
              canvas.restore();
            }

            @override
            bool shouldRepaint(covariant CanvasPainter oldDelegate) {
              return oldDelegate.settings != settings ||
                  oldDelegate.showGuides != showGuides ||
                  oldDelegate.image != image;
            }
          }

          class BottomTool extends StatelessWidget {
            final IconData icon;
            final String label;

            const BottomTool({
              super.key,
              required this.icon,
              required this.label,
            });

            @override
            Widget build(BuildContext context) {
              return Column(
                mainAxisAlignment: MainAxisAlignment.center,
                children: [
                  Icon(icon, color: Colors.white70),
                  const SizedBox(height: 6),
                  Text(
                    label,
                    style: const TextStyle(
                      fontSize: 12,
                      color: Colors.white70,
                    ),
                  ),
                ],
              );
            }
          }
          EOF

      - name: Configure Android SDK level 34
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i \
              -e 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/' \
              -e 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/' \
              -e 's/minSdk = flutter.minSdkVersion/minSdk = 21/' \
              -e 's/JavaVersion.VERSION_11/JavaVersion.VERSION_17/g' \
              android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i \
              -e 's/compileSdk flutter.compileSdkVersion/compileSdk 34/' \
              -e 's/targetSdk flutter.targetSdkVersion/targetSdk 34/' \
              -e 's/minSdk flutter.minSdkVersion/minSdk 21/' \
              -e 's/JavaVersion.VERSION_11/JavaVersion.VERSION_17/g' \
              android/app/build.gradle
          fi

      - name: Install dependencies
        run: flutter pub get

   

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app-release.apk
          if-no-files-found: error
          retention-days: 30
