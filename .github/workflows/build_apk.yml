name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter project
        run: flutter create --platforms android --org com.mystudio --project-name my_photoroom .

      - name: Remove generated sample test
        run: rm -f test/widget_test.dart

      - name: Download RMBG-1.4 model
        run: mkdir -p assets/models && curl -L -o assets/models/rmbg.onnx https://huggingface.co/briaai/RMBG-1.4/resolve/main/onnx/model_quantized.onnx

      - name: Write pubspec.yaml
        run: |
          cat <<'EOF' > pubspec.yaml
          name: my_photoroom
          description: Offline batch product photo studio powered by RMBG-1.4.
          publish_to: "none"
          version: 1.0.0+1

          environment:
            sdk: ">=3.3.0 <4.0.0"

          dependencies:
            flutter:
              sdk: flutter
            flutter_onnxruntime: ^1.9.0
            image_picker: ^1.1.2
            image: ^4.3.0
            gal: ^2.3.0
            path_provider: ^2.1.4
            shared_preferences: ^2.3.3

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^4.0.0

          flutter:
            uses-material-design: true
            assets:
              - assets/models/rmbg.onnx
          EOF

      - name: Write Android manifest
        run: |
          cat <<'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />

              <application
                  android:name="${applicationName}"
                  android:label="My PhotoRoom Studio"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:taskAffinity=""
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data android:name="io.flutter.embedding.android.NormalTheme" android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <meta-data android:name="flutterEmbedding" android:value="2" />
              </application>
          </manifest>
          EOF

      - name: Write batch studio app
        run: |
          mkdir -p lib
          cat <<'EOF' > lib/main.dart
          import 'dart:io';
          import 'dart:math' as math;
          import 'dart:typed_data';

          import 'package:flutter/material.dart';
          import 'package:flutter_onnxruntime/flutter_onnxruntime.dart';
          import 'package:gal/gal.dart';
          import 'package:image/image.dart' as img;
          import 'package:image_picker/image_picker.dart';
          import 'package:path_provider/path_provider.dart';
          import 'package:shared_preferences/shared_preferences.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const PhotoStudioApp());
          }

          enum StudioBackground { auto, coolSlate, warmAlabaster, softStone }
          enum LogoCorner { topLeft, topRight, bottomLeft, bottomRight }

          class Palette {
            const Palette(this.top, this.bottom, this.name);
            final Color top;
            final Color bottom;
            final String name;
          }

          const _palettes = <StudioBackground, Palette>{
            StudioBackground.coolSlate: Palette(
              Color(0xFF2C3038),
              Color(0xFF3E4450),
              'Cool Slate',
            ),
            StudioBackground.warmAlabaster: Palette(
              Color(0xFFF4F1EA),
              Color(0xFFE5E0D5),
              'Warm Alabaster',
            ),
            StudioBackground.softStone: Palette(
              Color(0xFFE6E8EC),
              Color(0xFFD5D9E0),
              'Soft Stone',
            ),
          };

          class ProductPhoto {
            ProductPhoto({
              required this.name,
              required this.source,
              required this.mask,
              required this.background,
            });

            final String name;
            final img.Image source;
            final img.Image mask;
            StudioBackground background;
            Uint8List? preview;
          }

          class PhotoStudioApp extends StatelessWidget {
            const PhotoStudioApp({super.key});

            @override
            Widget build(BuildContext context) => MaterialApp(
              title: 'My PhotoRoom Studio',
              debugShowCheckedModeBanner: false,
              theme: ThemeData(
                colorScheme: ColorScheme.fromSeed(
                  seedColor: const Color(0xFF7157E8),
                  brightness: Brightness.dark,
                ),
                useMaterial3: true,
              ),
              home: const StudioHome(),
            );
          }

          class StudioHome extends StatefulWidget {
            const StudioHome({super.key});

            @override
            State<StudioHome> createState() => _StudioHomeState();
          }

          class _StudioHomeState extends State<StudioHome> {
            final _picker = ImagePicker();
            final _runtime = OnnxRuntime();
            final _photos = <ProductPhoto>[];
            OrtSession? _session;
            String? _logoPath;
            LogoCorner _corner = LogoCorner.bottomRight;
            double _logoSize = 0.16;
            bool _working = false;
            String _status = 'Choose product photos to begin';
            int _currentPage = 0;

            @override
            void initState() {
              super.initState();
              _loadLogoSettings();
            }

            Future<void> _loadLogoSettings() async {
              final prefs = await SharedPreferences.getInstance();
              final savedPath = prefs.getString('brandLogoPath');
              if (savedPath != null && await File(savedPath).exists()) {
                _logoPath = savedPath;
              }

              final cornerName = prefs.getString('brandLogoCorner');
              if (cornerName != null) {
                _corner = LogoCorner.values.firstWhere(
                  (value) => value.name == cornerName,
                  orElse: () => LogoCorner.bottomRight,
                );
              }

              _logoSize = prefs.getDouble('brandLogoSize') ?? 0.16;
              if (mounted) setState(() {});
            }

            Future<void> _pickLogo() async {
              final picked = await _picker.pickImage(
                source: ImageSource.gallery,
                imageQuality: 100,
              );
              if (picked == null) return;

              if (!picked.path.toLowerCase().endsWith('.png')) {
                _message('Please choose a PNG brand logo.');
                return;
              }

              final bytes = await File(picked.path).readAsBytes();
              final decoded = img.decodePng(bytes);
              if (decoded == null) {
                _message('Please choose a valid PNG brand logo.');
                return;
              }

              final directory = await getApplicationDocumentsDirectory();
              final saved = await File(
                '${directory.path}/brand_logo.png',
              ).writeAsBytes(bytes);

              final prefs = await SharedPreferences.getInstance();
              await prefs.setString('brandLogoPath', saved.path);

              setState(() => _logoPath = saved.path);
              await _rerenderAll();
            }

            Future<void> _saveLogoSettings() async {
              final prefs = await SharedPreferences.getInstance();
              await prefs.setString('brandLogoCorner', _corner.name);
              await prefs.setDouble('brandLogoSize', _logoSize);
            }

            Future<OrtSession> _getSession() async {
              return _session ??= await _runtime.createSessionFromAsset(
                'assets/models/rmbg.onnx',
              );
            }

            Future<void> _selectBatch() async {
              final files = await _picker.pickMultiImage(imageQuality: 100);
              if (files.isEmpty || !mounted) return;

              setState(() {
                _working = true;
                _status = 'Loading RMBG-1.4…';
              });

              try {
                final session = await _getSession();

                for (var index = 0; index < files.length; index++) {
                  if (!mounted) return;

                  setState(() {
                    _status = 'Processing ${index + 1} of ${files.length}…';
                  });

                  final bytes = await File(files[index].path).readAsBytes();
                  final source = img.decodeImage(bytes);
                  if (source == null) {
                    throw StateError(
                      'Could not decode ${files[index].name}',
                    );
                  }

                  final mask = await _inferMask(session, source);
                  final photo = ProductPhoto(
                    name: files[index].name,
                    source: source,
                    mask: mask,
                    background: _autoBackground(source, mask),
                  );

                  photo.preview = await _render(photo);
                  _photos.add(photo);

                  if (mounted) setState(() {});
                }

                if (_photos.isNotEmpty) {
                  _currentPage = _photos.length - 1;
                }
              } catch (error) {
                _message('Batch processing failed: $error');
              } finally {
                if (mounted) {
                  setState(() {
                    _working = false;
                    _status = _photos.isEmpty
                        ? 'Choose product photos to begin'
                        : '${_photos.length} product photo(s) ready';
                  });
                }
              }
            }

            Future<img.Image> _inferMask(
              OrtSession session,
              img.Image source,
            ) async {
              const side = 1024;

              final resized = img.copyResize(
                source,
                width: side,
                height: side,
                interpolation: img.Interpolation.linear,
              );

              final plane = side * side;
              final inputData = Float32List(3 * plane);

              for (var y = 0; y < side; y++) {
                for (var x = 0; x < side; x++) {
                  final pixel = resized.getPixel(x, y);
                  final offset = y * side + x;
                  inputData[offset] =
                      (pixel.r.toDouble() / 255.0 - 0.5) / 1.0;
                  inputData[plane + offset] =
                      (pixel.g.toDouble() / 255.0 - 0.5) / 1.0;
                  inputData[2 * plane + offset] =
                      (pixel.b.toDouble() / 255.0 - 0.5) / 1.0;
                }
              }

              final input = await OrtValue.fromList(
                inputData,
                const [1, 3, side, side],
              );

              Map<String, OrtValue> outputs = {};

              try {
                outputs = await session.run({
                  session.inputNames.first: input,
                });

                if (outputs.isEmpty) {
                  throw StateError('RMBG-1.4 returned no mask output');
                }

                final output = outputs[session.outputNames.first];
                if (output == null) {
                  throw StateError(
                    'RMBG-1.4 mask output is missing',
                  );
                }

                final values = await output.asFlattenedList();
                if (values.length < plane) {
                  throw StateError(
                    'RMBG-1.4 mask has ${values.length} values; '
                    'expected at least $plane',
                  );
                }

                final maskSmall = img.Image(
                  width: side,
                  height: side,
                  numChannels: 1,
                );

                for (var y = 0; y < side; y++) {
                  for (var x = 0; x < side; x++) {
                    final raw =
                        (values[y * side + x] as num).toDouble();
                    final alpha = raw.isFinite
                        ? (raw < 0 || raw > 1
                            ? 1 / (1 + math.exp(-raw))
                            : raw)
                        : 0.0;
                    final level =
                        (alpha.clamp(0.0, 1.0) * 255).round();
                    maskSmall.setPixelRgba(
                      x,
                      y,
                      level,
                      level,
                      level,
                      255,
                    );
                  }
                }

                return img.copyResize(
                  maskSmall,
                  width: source.width,
                  height: source.height,
                  interpolation: img.Interpolation.linear,
                );
              } finally {
                await input.dispose();
                for (final value in outputs.values) {
                  await value.dispose();
                }
              }
            }

            StudioBackground _autoBackground(
              img.Image source,
              img.Image mask,
            ) {
              var luminance = 0.0;
              var saturation = 0.0;
              var count = 0;
              final step = math.max(
                1,
                (source.width * source.height) ~/ 50000,
              );
              var index = 0;

              for (var y = 0; y < source.height; y++) {
                for (var x = 0; x < source.width; x++, index++) {
                  if (index % step != 0 ||
                      mask.getPixel(x, y).r < 128) {
                    continue;
                  }

                  final p = source.getPixel(x, y);
                  final r = p.r.toDouble() / 255;
                  final g = p.g.toDouble() / 255;
                  final b = p.b.toDouble() / 255;

                  luminance +=
                      0.2126 * r + 0.7152 * g + 0.0722 * b;
                  saturation +=
                      math.max(r, math.max(g, b)) -
                      math.min(r, math.min(g, b));
                  count++;
                }
              }

              if (count == 0) {
                return StudioBackground.softStone;
              }

              final mean = luminance / count;
              final meanSaturation = saturation / count;

              if (meanSaturation > 0.28) {
                return StudioBackground.softStone;
              }
              if (mean > 0.62) {
                return StudioBackground.coolSlate;
              }
              if (mean < 0.32) {
                return StudioBackground.warmAlabaster;
              }
              return StudioBackground.softStone;
            }

            Future<Uint8List> _render(ProductPhoto photo) async {
              final source = photo.source;
              final width = source.width;
              final height = source.height;

              final palette =
                  _palettes[photo.background]!;

              final result = img.Image(
                width: width,
                height: height,
                numChannels: 4,
              );

              for (var y = 0; y < height; y++) {
                final t =
                    height <= 1 ? 0.0 : y / (height - 1);
                for (var x = 0; x < width; x++) {
                  final r = (palette.top.red * (1 - t) +
                          palette.bottom.red * t)
                      .round();
                  final g = (palette.top.green * (1 - t) +
                          palette.bottom.green * t)
                      .round();
                  final b = (palette.top.blue * (1 - t) +
                          palette.bottom.blue * t)
                      .round();
                  result.setPixelRgba(x, y, r, g, b, 255);
                }
              }

              var minX = width;
              var maxX = 0;
              var minY = height;
              var maxY = 0;
              var found = false;

              for (var y = 0; y < height; y++) {
                for (var x = 0; x < width; x++) {
                  if (photo.mask.getPixel(x, y).r > 24) {
                    found = true;
                    minX = math.min(minX, x);
                    maxX = math.max(maxX, x);
                    minY = math.min(minY, y);
                    maxY = math.max(maxY, y);
                  }
                }
              }

              if (found) {
                final centerX = (minX + maxX) / 2.0;
                final centerY =
                    math.min(height - 1.0, maxY + (maxY - minY) * 0.035);
                final radiusX =
                    math.max(1.0, (maxX - minX) * 0.34);
                final radiusY =
                    math.max(1.0, (maxY - minY) * 0.055);

                for (var y =
                        math.max(
                          0,
                          (centerY - radiusY * 2.5).floor(),
                        );
                    y <
                        math.min(
                          height,
                          (centerY + radiusY * 2.5).ceil(),
                        );
                    y++) {
                  for (var x =
                          math.max(
                            0,
                            (centerX - radiusX * 2.5).floor(),
                          );
                      x <
                          math.min(
                            width,
                            (centerX + radiusX * 2.5).ceil(),
                          );
                      x++) {
                    final d =
                        math.pow((x - centerX) / radiusX, 2) +
                        math.pow((y - centerY) / radiusY, 2);

                    final alpha =
                        (math.exp(-d * 1.8) * 0.24)
                            .clamp(0.0, 0.24);

                    if (alpha < 0.002) continue;

                    final old = result.getPixel(x, y);
                    result.setPixelRgba(
                      x,
                      y,
                      (old.r * (1 - alpha)).round(),
                      (old.g * (1 - alpha)).round(),
                      (old.b * (1 - alpha)).round(),
                      255,
                    );
                  }
                }
              }

              for (var y = 0; y < height; y++) {
                for (var x = 0; x < width; x++) {
                  final alpha =
                      (photo.mask.getPixel(x, y).r.toDouble() / 255)
                          .clamp(0.0, 1.0);

                  if (alpha <= 0) continue;

                  final fg = source.getPixel(x, y);
                  final bg = result.getPixel(x, y);

                  result.setPixelRgba(
                    x,
                    y,
                    (fg.r * alpha + bg.r * (1 - alpha)).round(),
                    (fg.g * alpha + bg.g * (1 - alpha)).round(),
                    (fg.b * alpha + bg.b * (1 - alpha)).round(),
                    255,
                  );
                }
              }

              final logoPath = _logoPath;
              if (logoPath != null && await File(logoPath).exists()) {
                final logo = img.decodeImage(
                  await File(logoPath).readAsBytes(),
                );

                if (logo != null) {
                  final logoWidth =
                      math.max((width * _logoSize).round(), 1);
                  final resizedLogo = img.copyResize(
                    logo,
                    width: logoWidth,
                    interpolation: img.Interpolation.linear,
                  );

                  final pad =
                      math.max((width * 0.025).round(), 12);

                  final left = _corner == LogoCorner.topLeft ||
                          _corner == LogoCorner.bottomLeft
                      ? pad
                      : width - resizedLogo.width - pad;

                  final top = _corner == LogoCorner.topLeft ||
                          _corner == LogoCorner.topRight
                      ? pad
                      : height - resizedLogo.height - pad;

                  for (var y = 0;
                      y < resizedLogo.height;
                      y++) {
                    for (var x = 0;
                        x < resizedLogo.width;
                        x++) {
                      final dx = left + x;
                      final dy = top + y;

                      if (dx < 0 ||
                          dx >= width ||
                          dy < 0 ||
                          dy >= height) {
                        continue;
                      }

                      final fg = resizedLogo.getPixel(x, y);
                      final bg = result.getPixel(dx, dy);
                      final a =
                          (fg.a.toDouble() / 255)
                              .clamp(0.0, 1.0);

                      result.setPixelRgba(
                        dx,
                        dy,
                        (fg.r * a + bg.r * (1 - a)).round(),
                        (fg.g * a + bg.g * (1 - a)).round(),
                        (fg.b * a + bg.b * (1 - a)).round(),
                        255,
                      );
                    }
                  }
                }
              }

              return Uint8List.fromList(
                img.encodePng(result, level: 6),
              );
            }

            Future<void> _rerenderAll() async {
              for (final photo in _photos) {
                photo.preview = await _render(photo);
              }
              if (mounted) setState(() {});
            }

            Future<void> _changeBackground(
              StudioBackground? value,
            ) async {
              if (value == null || _photos.isEmpty) return;

              final photo = _photos[
                  _currentPage.clamp(0, _photos.length - 1)];

              setState(() {
                photo.background =
                    value == StudioBackground.auto
                        ? _autoBackground(photo.source, photo.mask)
                        : value;
              });

              photo.preview = await _render(photo);
              if (mounted) setState(() {});
            }

            Future<void> _saveAll() async {
              if (_photos.isEmpty) return;

              setState(() {
                _working = true;
                _status =
                    'Saving ${_photos.length} HD image(s)…';
              });

              try {
                final directory =
                    await getTemporaryDirectory();

                for (var i = 0;
                    i < _photos.length;
                    i++) {
                  final bytes =
                      _photos[i].preview ??
                      await _render(_photos[i]);

                  final file = File(
                    '${directory.path}/photoroom_'
                    '${DateTime.now().millisecondsSinceEpoch}_$i.png',
                  );

                  await file.writeAsBytes(bytes, flush: true);
                  await Gal.putImage(
                    file.path,
                    album: 'My PhotoRoom Studio',
                  );
                }

                _message(
                  'Saved all ${_photos.length} photos to your gallery.',
                );
              } catch (error) {
                _message(
                  'Could not save all photos: $error',
                );
              } finally {
                if (mounted) {
                  setState(() {
                    _working = false;
                    _status =
                        '${_photos.length} product photo(s) ready';
                  });
                }
              }
            }

            void _message(String message) {
              if (mounted) {
                ScaffoldMessenger.of(context).showSnackBar(
                  SnackBar(content: Text(message)),
                );
              }
            }

            @override
            void dispose() {
              _session?.close();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              final current = _photos.isEmpty
                  ? null
                  : _photos[
                      _currentPage.clamp(
                        0,
                        _photos.length - 1,
                      )];

              return Scaffold(
                appBar: AppBar(
                  title: const Text('Product Photo Studio'),
                  actions: [
                    IconButton(
                      tooltip: 'Choose PNG brand logo',
                      onPressed:
                          _working ? null : _pickLogo,
                      icon: const Icon(
                        Icons.branding_watermark,
                      ),
                    ),
                    if (_photos.isNotEmpty)
                      IconButton(
                        tooltip: 'Save all to gallery',
                        onPressed:
                            _working ? null : _saveAll,
                        icon: const Icon(Icons.save_alt),
                      ),
                  ],
                ),
                body: SafeArea(
                  child: Column(
                    children: [
                      Padding(
                        padding: const EdgeInsets.fromLTRB(
                          16,
                          8,
                          16,
                          8,
                        ),
                        child: Column(
                          crossAxisAlignment:
                              CrossAxisAlignment.stretch,
                          children: [
                            FilledButton.icon(
                              onPressed:
                                  _working ? null : _selectBatch,
                              icon: const Icon(
                                Icons.add_photo_alternate,
                              ),
                              label: const Text(
                                '+ Select Product Photos (Batch)',
                              ),
                            ),
                            const SizedBox(height: 8),
                            Row(
                              children: [
                                Expanded(
                                  child: Text(
                                    _logoPath == null
                                        ? 'Brand logo: not set'
                                        : 'Brand logo: ready',
                                    overflow:
                                        TextOverflow.ellipsis,
                                  ),
                                ),
                                DropdownButton<LogoCorner>(
                                  value: _corner,
                                  onChanged: _working
                                      ? null
                                      : (value) {
                                          if (value == null) {
                                            return;
                                          }
                                          setState(
                                            () => _corner = value,
                                          );
                                          _saveLogoSettings();
                                          _rerenderAll();
                                        },
                                  items: const [
                                    DropdownMenuItem(
                                      value: LogoCorner.topLeft,
                                      child: Text('Top-Left'),
                                    ),
                                    DropdownMenuItem(
                                      value: LogoCorner.topRight,
                                      child: Text('Top-Right'),
                                    ),
                                    DropdownMenuItem(
                                      value:
                                          LogoCorner.bottomLeft,
                                      child:
                                          Text('Bottom-Left'),
                                    ),
                                    DropdownMenuItem(
                                      value:
                                          LogoCorner.bottomRight,
                                      child:
                                          Text('Bottom-Right'),
                                    ),
                                  ],
                                ),
                              ],
                            ),
                            Row(
                              children: [
                                const Text('Logo size'),
                                Expanded(
                                  child: Slider(
                                    value: _logoSize,
                                    min: 0.06,
                                    max: 0.32,
                                    onChanged: _working
                                        ? null
                                        : (v) {
                                            setState(
                                              () => _logoSize = v,
                                            );
                                            _saveLogoSettings();
                                          },
                                    onChangeEnd: (_) =>
                                        _rerenderAll(),
                                  ),
                                ),
                                Text(
                                  '${(_logoSize * 100).round()}%',
                                ),
                              ],
                            ),
                          ],
                        ),
                      ),
                      if (current != null)
                        Padding(
                          padding:
                              const EdgeInsets.symmetric(
                            horizontal: 16,
                          ),
                          child: Row(
                            children: [
                              Expanded(
                                child: Text(
                                  '${_currentPage + 1}/'
                                  '${_photos.length}  •  '
                                  '${current.name}',
                                  maxLines: 1,
                                  overflow:
                                      TextOverflow.ellipsis,
                                ),
                              ),
                              DropdownButton<StudioBackground>(
                                value: current.background,
                                onChanged: _working
                                    ? null
                                    : _changeBackground,
                                items: const [
                                  DropdownMenuItem(
                                    value:
                                        StudioBackground.auto,
                                    child:
                                        Text('Auto studio'),
                                  ),
                                  DropdownMenuItem(
                                    value:
                                        StudioBackground.coolSlate,
                                    child:
                                        Text('Cool Slate'),
                                  ),
                                  DropdownMenuItem(
                                    value: StudioBackground
                                        .warmAlabaster,
                                    child: Text(
                                      'Warm Alabaster',
                                    ),
                                  ),
                                  DropdownMenuItem(
                                    value:
                                        StudioBackground.softStone,
                                    child:
                                        Text('Soft Stone'),
